<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">FSLogix on ZFSSA architecture overview</title>
  <desc id="desc">Architecture diagram showing Active Directory, Windows 11 Secure Desktops, ZFSSA SMB storage, administration access, and FSLogix profile container traffic.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .box-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-subtitle { font: 700 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .text { font: 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .label { font: 700 12px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .vcn { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .ad { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 16; }
      .desktop { fill: #f0fdf4; stroke: #34d399; stroke-width: 2; rx: 16; }
      .zfs { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 16; }
      .volume { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; rx: 14; }
      .admin { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; rx: 16; }
      .network { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 18; stroke-dasharray: 8 6; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .arrow-orange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); stroke-dasharray: 7 5; }
      .legend { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760" />
  <text class="title" x="40" y="52">Microsoft FSLogix Profile Containers on Oracle ZFSSA SMB</text>
  <text class="subtitle" x="40" y="80">示例环境：AD/DNS/DC 10.100.0.163，ZFSSA data IP 192.168.0.45，SMB path \\192.168.0.45\primary\profiles</text>

  <rect class="vcn" x="40" y="120" width="340" height="260" />
  <text class="box-title" x="62" y="154">AD VCN / AD Subnet</text>
  <rect class="ad" x="70" y="185" width="280" height="150" />
  <text class="box-title" x="96" y="220">Active Directory</text>
  <text class="box-subtitle" x="96" y="248">AD / DNS / Domain Controller</text>
  <text class="text" x="96" y="276">IP: 10.100.0.163</text>
  <text class="text" x="96" y="302">Domain: js.l</text>
  <text class="small" x="96" y="326">Users / Groups / DNS SRV / Kerberos</text>

  <rect class="network" x="440" y="160" width="400" height="160" />
  <text class="box-title" x="488" y="202">Private Connectivity</text>
  <text class="text" x="488" y="232">VCN peering / DRG / route tables</text>
  <text class="text" x="488" y="260">Security rules allow required ports</text>
  <text class="small" x="488" y="288">DNS 53, Kerberos 88, LDAP 389/636, SMB 445</text>

  <rect class="vcn" x="900" y="120" width="340" height="390" />
  <text class="box-title" x="922" y="154">ZFSSA VCN / Private Subnet</text>
  <rect class="zfs" x="930" y="185" width="280" height="190" />
  <text class="box-title" x="956" y="220">Oracle ZFSSA</text>
  <text class="box-subtitle" x="956" y="248">SMB Profile Storage</text>
  <text class="text" x="956" y="276">zfs-data-a: 192.168.0.45</text>
  <text class="text" x="956" y="302">Share: primary / profiles</text>
  <text class="small" x="956" y="326">FSLogix VHDX containers</text>
  <text class="small" x="956" y="350">Admin VNIC only for BUI / SSH</text>
  <rect class="volume" x="955" y="400" width="230" height="70" />
  <text class="box-subtitle" x="985" y="432">OCI Block Volumes</text>
  <text class="small" x="985" y="456">Mirrored ZFSSA storage pool</text>

  <rect class="vcn" x="250" y="470" width="580" height="190" />
  <text class="box-title" x="272" y="504">Windows 11 Secure Desktops / Golden Image</text>
  <rect class="desktop" x="290" y="530" width="500" height="95" />
  <text class="box-title" x="320" y="562">FSLogix Profile Container Client</text>
  <text class="text" x="320" y="590">User sees: C:\Users\&lt;username&gt;</text>
  <text class="small" x="320" y="614">Profile data is mounted from ZFSSA SMB VHDX</text>

  <rect class="admin" x="930" y="560" width="280" height="110" />
  <text class="box-title" x="960" y="594">Admin Access</text>
  <text class="text" x="960" y="622">Bastion / VPN / Trusted IP</text>
  <text class="small" x="960" y="646">BUI :215 / SSH :22 to zfs-adm-a</text>

  <path class="arrow-blue" d="M350 262 C420 262, 410 240, 440 240" />
  <path class="arrow-blue" d="M840 240 C875 240, 875 262, 930 262" />
  <text class="label" x="392" y="224">ZFSSA joins AD</text>
  <text class="small" x="392" y="244">DNS / Kerberos / LDAP</text>

  <path class="arrow-green" d="M770 552 C855 520, 860 330, 930 300" />
  <text class="label" x="768" y="482">SMB TCP/445</text>
  <text class="small" x="768" y="502">\\192.168.0.45\primary\profiles</text>

  <path class="arrow-blue" d="M320 530 C250 455, 245 360, 300 335" />
  <text class="label" x="188" y="430">User authentication</text>
  <text class="small" x="188" y="450">DNS / Kerberos / NTLM</text>

  <path class="arrow-orange" d="M1070 375 L1070 400" />
  <text class="small" x="1082" y="392">pool</text>

  <path class="arrow-purple" d="M1070 560 L1070 375" />
  <text class="label" x="1090" y="526">Management only</text>

  <rect class="legend" x="40" y="565" width="180" height="110" />
  <text class="box-subtitle" x="62" y="596">Traffic Legend</text>
  <line x1="62" y1="620" x2="110" y2="620" class="arrow-blue" />
  <text class="small" x="122" y="624">AD / DNS</text>
  <line x1="62" y1="645" x2="110" y2="645" class="arrow-green" />
  <text class="small" x="122" y="649">SMB data</text>
  <line x1="62" y1="670" x2="110" y2="670" class="arrow-orange" />
  <text class="small" x="122" y="674">Storage pool</text>
</svg>
